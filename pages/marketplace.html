<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zulfishan — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/catalogue.css">
<link rel="stylesheet" href="../css/marketplace.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div>
      <div class="brand"><img src="../assets/img/logo-mark.png" alt="Zulfishan" class="brand-logo">Zulfishan</div>
      <nav>
        <div class="nav-group-label" data-i18n="navLearn">Learn</div>
        <a href="course-catalogue.html"><span class="dot"></span><span data-i18n="navCourses">Courses</span></a>
        <a href="mushaf.html"><span class="dot"></span><span data-i18n="navMushaf">Qur'an</span></a>
        <a href="hifz-tracker.html"><span class="dot"></span><span data-i18n="navHifz">My Hifz Tracker</span></a>
        <div class="nav-group-label" data-i18n="navPractice">Practice</div>
        <a href="practice-hub.html"><span class="dot"></span><span data-i18n="navDailyPractice">Daily Practice</span></a>
        <a href="fatwa.html"><span class="dot"></span><span data-i18n="navFatwa">Fatwa Q&A</span></a>
        <a href="duas.html"><span class="dot"></span><span data-i18n="navDuas">Dua &amp; Azkar</span></a>
        <a href="hijri-calendar.html"><span class="dot"></span><span data-i18n="navHijri">Hijri Calendar</span></a>
        <a href="zakat-calculator.html"><span class="dot"></span><span data-i18n="navZakat">Zakat Calculator</span></a>
        <div class="nav-group-label" data-i18n="navMore">More</div>
        <a href="marketplace.html" class="active"><span class="dot"></span><span data-i18n="navMarketplace">Marketplace</span></a>
        <a href="community.html"><span class="dot"></span><span data-i18n="navCommunity">Community</span></a>
        <div class="nav-group-label" data-i18n="navAccount">Account</div>
        <a href="profile.html"><span class="dot"></span><span data-i18n="navProfile">Profile</span></a>
      </nav>
    </div>
    <div class="sidebar-foot">
      <button class="lang-toggle" onclick="toggleLang()" style="width:100%; color:#fff; border-color:rgba(255,255,255,0.3); margin-bottom:14px;">اردو / EN</button>
      <a href="profile.html" style="text-decoration:none; color:inherit;">
      <div class="user-chip link">
        <div class="av"></div>
        <div><div class="name" data-i18n="userName">Ahmad Raza</div><div class="role" data-i18n="userRole">Learner</div></div>
      </div>
      </a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar-inner">
      <div class="page-title" data-i18n="pageTitle">Marketplace</div>
      <div class="topbar-actions">
        <button class="btn btn-ghost sm cart-btn" id="cartToggle">
          🛒 <span data-i18n="cartLabel">Cart</span> <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>

    <div class="content">

      <div class="market-head">
        <p data-i18n="pageIntro">Books, prayer essentials, and ritual-sensitive goods from verified vendors.</p>
      </div>

      <div class="filter-row">
        <button class="filter-chip active" data-group="cat" data-value="all" data-i18n="filterAll">All</button>
        <div class="filter-divider"></div>
        <button class="filter-chip" data-group="cat" data-value="books" data-i18n="catBooks">Books</button>
        <button class="filter-chip" data-group="cat" data-value="prayer" data-i18n="catPrayer">Prayer Essentials</button>
        <button class="filter-chip" data-group="cat" data-value="ritual" data-i18n="catRitual">Ehram &amp; Kafan</button>
        <button class="filter-chip" data-group="cat" data-value="gifts" data-i18n="catGifts">Gifts</button>
      </div>

      <div class="grid-products" id="productGrid"></div>

    </div>
  </div>
</div>

<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h3 data-i18n="cartHeading">Your Cart</h3>
    <button class="modal-close" id="cartClose">&times;</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total-row"><span data-i18n="total">Total</span><span id="cartTotal">PKR 0</span></div>
    <button class="btn btn-primary" style="width:100%;" id="checkoutBtn" data-i18n="checkout">Checkout</button>
  </div>
</div>

<script src="../js/i18n-marketplace.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/marketplace.js"></script>
</body>
</html>
